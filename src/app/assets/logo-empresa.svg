<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo exterior con degradado -->
  <circle cx="60" cy="60" r="58" fill="url(#grad1)" stroke="#F03D26" stroke-width="3"/>
  
  <!-- Degradados -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F03D26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Forma de camión simplificado -->
  <g transform="translate(25, 35)">
    <!-- Cabina del camión -->
    <rect x="0" y="20" width="25" height="30" fill="url(#grad2)" stroke="#D32F2F" stroke-width="2" rx="3"/>
    
    <!-- Contenedor/Trailer -->
    <rect x="25" y="15" width="45" height="35" fill="url(#grad2)" stroke="#D32F2F" stroke-width="2" rx="3"/>
    
    <!-- Líneas decorativas del contenedor -->
    <line x1="30" y1="15" x2="30" y2="50" stroke="#F03D26" stroke-width="1.5"/>
    <line x1="40" y1="15" x2="40" y2="50" stroke="#F03D26" stroke-width="1.5"/>
    <line x1="50" y1="15" x2="50" y2="50" stroke="#F03D26" stroke-width="1.5"/>
    <line x1="60" y1="15" x2="60" y2="50" stroke="#F03D26" stroke-width="1.5"/>
    
    <!-- Ventana de la cabina -->
    <rect x="5" y="25" width="15" height="12" fill="#40A095" opacity="0.7" rx="2"/>
    
    <!-- Ruedas -->
    <circle cx="15" cy="52" r="6" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>
    <circle cx="15" cy="52" r="3" fill="#95A5A6"/>
    
    <circle cx="35" cy="52" r="6" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>
    <circle cx="35" cy="52" r="3" fill="#95A5A6"/>
    
    <circle cx="60" cy="52" r="6" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>
    <circle cx="60" cy="52" r="3" fill="#95A5A6"/>
    
    <!-- Detalle de movimiento (líneas de velocidad) -->
    <line x1="-5" y1="10" x2="5" y2="10" stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <line x1="-3" y1="15" x2="8" y2="15" stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  </g>
  
  <!-- Letras TDS (Transportes Del Sur) en la parte superior -->
  <text x="60" y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TDS</text>
  
  <!-- Línea decorativa inferior -->
  <path d="M 20 95 Q 60 100 100 95" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
